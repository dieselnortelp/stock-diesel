<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Stock - Diesel Norte</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #172554;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); line-height: 1.5; padding-bottom: 40px; }

        header { background-color: var(--primary); color: white; padding: 1.5rem 2rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .header-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-area h1 { font-size: 1.5rem; font-weight: 700; }

        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }

        .card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1); margin-bottom: 2rem; overflow: hidden; }
        .card-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); background-color: #fcfcfd; }
        .card-header h2 { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem; padding: 1.5rem; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.875rem; font-weight: 500; color: var(--text-muted); }
        input, select { padding: 0.625rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }
        
        /* Estilo especial para el input de archivo */
        input[type="file"] { padding: 0.4rem; background: #f8fafc; cursor: pointer; }

        .btn-add { background-color: var(--primary); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 1.5rem 1.5rem auto; transition: background 0.2s; width: calc(100% - 3rem); max-width: 300px; }
        .btn-add:hover { background-color: var(--primary-hover); }

        .search-area { padding: 0 1.5rem 1.5rem; position: relative; }
        .search-input { width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem; border-radius: 8px; border: 1px solid var(--border); }
        .search-icon { position: absolute; left: 2.2rem; top: 0.8rem; color: var(--text-muted); }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 800px; }
        th { background-color: #1e293b; padding: 1rem; font-size: 0.8rem; text-transform: uppercase; color: white; font-weight: 600; }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.95rem; vertical-align: middle; }
        tr:hover { background-color: #f1f5f9; }

        /* Imágenes en la tabla */
        .thumb-img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); background: #fff; }
        .qr-canvas { width: 50px; height: 50px; border-radius: 4px; }

        .stock-badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-weight: 600; text-align: center; display: inline-block; min-width: 40px;}
        .stock-low { background-color: #fef2f2; color: var(--danger); }
        .stock-ok { background-color: #f0fdf4; color: var(--success); }

        .actions { display: flex; gap: 4px; }
        .btn-icon { border: none; background: none; cursor: pointer; padding: 6px; border-radius: 4px; }
        .btn-icon:hover { background: #e2e8f0; }
        .delete-btn { color: var(--danger); }
        .stock-btn { color: var(--success); }
        .stock-btn-minus { color: var(--warning); }

        footer { text-align: center; margin-top: 3rem; color: var(--text-muted); font-size: 0.85rem; padding: 2rem; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo-area">
                <i data-lucide="settings-2"></i>
                <h1>Diesel Norte - Control de Stock</h1>
            </div>
            <span>La Plata, Arg.</span>
        </div>
    </header>

    <div class="container">
        <section class="card">
            <div class="card-header">
                <h2><i data-lucide="plus-circle"></i> Añadir Nuevo Repuesto</h2>
            </div>
            <div class="form-grid">
                <div class="input-group">
                    <label>Nombre del Repuesto</label>
                    <input type="text" id="nombre" placeholder="Ej: Inyector Bosch 0445">
                </div>
                <div class="input-group">
                    <label>Marca</label>
                    <input type="text" id="marca" placeholder="Ej: Bosch, Delphi">
                </div>
                <div class="input-group">
                    <label>Código / Part Number</label>
                    <input type="text" id="codigo" placeholder="Ej: F 00R J02 177">
                </div>
                <div class="input-group">
                    <label>Categoría</label>
                    <select id="categoria">
                        <option value="Inyector">Inyector</option>
                        <option value="Bomba">Bomba</option>
                        <option value="Kit">Kit de Sellos</option>
                        <option value="Válvula">Válvula</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Ubicación</label>
                    <input type="text" id="ubicacion" placeholder="Estante A-12">
                </div>
                <div class="input-group">
                    <label>Stock Mínimo</label>
                    <input type="number" id="minimo" value="5">
                </div>
                <div class="input-group">
                    <label>Cantidad Inicial</label>
                    <input type="number" id="cantidad" value="0">
                </div>
                <div class="input-group">
                    <label>Foto del Repuesto</label>
                    <input type="file" id="imagen" accept="image/*">
                </div>
            </div>
            <button class="btn-add" onclick="agregarRepuesto()">
                <i data-lucide="save"></i> Agregar Repuesto
            </button>
        </section>

        <section class="card">
            <div class="card-header">
                <h2><i data-lucide="list"></i> Inventario de Repuestos Actual</h2>
            </div>
            <div class="search-area">
                <i data-lucide="search" class="search-icon" size="18"></i>
                <input type="text" id="buscar" class="search-input" placeholder="Buscar por código, nombre o marca..." onkeyup="filtrarTabla()">
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>Código QR</th>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Marca / Tipo</th>
                            <th>Ubicación</th>
                            <th>Stock Min.</th>
                            <th>Cant. Actual</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaRepuestos">
                        </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        lucide.createIcons();

        // Aún usamos localStorage temporalmente hasta integrar Firebase
        let inventario = JSON.parse(localStorage.getItem('dieselStock')) || [];

        function guardarLocal() {
            localStorage.setItem('dieselStock', JSON.stringify(inventario));
            renderizarTabla();
        }

        // Convertir imagen a formato guardable (Base64)
        function leerImagen(input, callback) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    callback(e.target.result);
                };
                reader.readAsDataURL(input.files[0]);
            } else {
                // Imagen por defecto si no suben nada
                callback('https://via.placeholder.com/50?text=No+Img');
            }
        }

        function agregarRepuesto() {
            const inputImg = document.getElementById('imagen');
            
            leerImagen(inputImg, function(imagenBase64) {
                const nuevo = {
                    id: Date.now(),
                    nombre: document.getElementById('nombre').value,
                    marca: document.getElementById('marca').value,
                    codigo: document.getElementById('codigo').value,
                    categoria: document.getElementById('categoria').value,
                    ubicacion: document.getElementById('ubicacion').value,
                    minimo: parseInt(document.getElementById('minimo').value),
                    cantidad: parseInt(document.getElementById('cantidad').value),
                    imagen: imagenBase64
                };

                if(!nuevo.nombre || !nuevo.codigo) return alert("Nombre y Código son obligatorios");

                inventario.push(nuevo);
                guardarLocal();
                
                // Limpiar formulario
                document.querySelectorAll('input').forEach(i => i.value = (i.type === 'number' ? 0 : ''));
                document.getElementById('minimo').value = 5;
                document.getElementById('imagen').value = '';
            });
        }

        function cambiarStock(id, cantidad) {
            const item = inventario.find(i => i.id === id);
            if(item) {
                item.cantidad = Math.max(0, item.cantidad + cantidad);
                guardarLocal();
            }
        }

        function eliminarRepuesto(id) {
            if(confirm("¿Estás seguro de eliminar este ítem?")) {
                inventario = inventario.filter(i => i.id !== id);
                guardarLocal();
            }
        }

        function filtrarTabla() {
            const query = document.getElementById('buscar').value.toLowerCase();
            renderizarTabla(query);
        }

        function renderizarTabla(filtro = '') {
            const tbody = document.getElementById('listaRepuestos');
            tbody.innerHTML = '';

            // Array para guardar los IDs y Códigos de los QR que hay que dibujar
            let qrsADibujar = [];

            inventario.forEach(item => {
                if(item.nombre.toLowerCase().includes(filtro) || 
                   item.codigo.toLowerCase().includes(filtro) || 
                   item.marca.toLowerCase().includes(filtro)) {
                    
                    const esBajo = item.cantidad <= item.minimo;
                    
                    const row = `
                        <tr>
                            <td><img src="${item.imagen}" class="thumb-img" alt="Repuesto"></td>
                            <td><canvas id="qr-${item.id}" class="qr-canvas"></canvas></td>
                            <td><strong>${item.codigo}</strong></td>
                            <td>${item.nombre}</td>
                            <td>${item.marca} <br><small>${item.categoria}</small></td>
                            <td>${item.ubicacion}</td>
                            <td>${item.minimo}</td>
                            <td>
                                <span class="stock-badge ${esBajo ? 'stock-low' : 'stock-ok'}">
                                    ${item.cantidad}
                                </span>
                            </td>
                            <td class="actions">
                                <button class="btn-icon stock-btn" onclick="cambiarStock(${item.id}, 1)" title="Sumar"><i data-lucide="plus-circle"></i></button>
                                <button class="btn-icon stock-btn-minus" onclick="cambiarStock(${item.id}, -1)" title="Restar"><i data-lucide="minus-circle"></i></button>
                                <button class="btn-icon delete-btn" onclick="eliminarRepuesto(${item.id})" title="Eliminar"><i data-lucide="trash-2"></i></button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                    
                    // Agregamos este item a la lista de QRs a generar
                    qrsADibujar.push({ id: item.id, codigo: item.codigo });
                }
            });
            
            lucide.createIcons();

            // Dibujar todos los QRs después de que el HTML ya está en pantalla
            qrsADibujar.forEach(qrInfo => {
                new QRious({
                    element: document.getElementById(`qr-${qrInfo.id}`),
                    value: qrInfo.codigo,
                    size: 60,
                    level: 'M'
                });
            });
        }

        renderizarTabla();
    </script>
</body>
</html>
